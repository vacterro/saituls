name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  regs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provision test prerequisites (hermetic, no third-party services)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\ci_fixtures.ps1 -IncludePythonLauncher -PublishPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove the suite fails loudly when the stub layer is gone
        shell: pwsh
        run: |
          # The negative control for the fixture layer itself: removing the
          # stubs must break the dependent harnesses, never silently skip.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_ci_hermetic.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run integrity suite
        shell: pwsh
        run: |
          python tests\test_regs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAI Accounts control plane (registry, broker, compat shim)
        shell: pwsh
        run: |
          # Builds Scripts\accounts\bin\sai-accounts.exe + sai-antigravity.exe
          # (missing csc = FAIL, never SKIP) and drives the contract against an
          # isolated SAI_ACCOUNTS_ROOT. Never touches the live registry.
          python tests\test_sai_accounts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAI Accounts native spawn contract (CreateProcessWithLogonW)
        shell: pwsh
        run: |
          # The interop surface behind T-232's spawn path: the exact
          # CreateProcessWithLogonW ABI, the logon-flag namespace, the logon
          # happening in the operator's session rather than the service, and no
          # credential reaching a command line, environment block, log or pipe.
          # This is a CONTRACT test and says so -- it never claims to prove a
          # live second-identity broker starts on a desktop.
          python tests\test_sai_accounts_native_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAI Accounts selector and identity contract
        shell: pwsh
        run: |
          python tests\test_sai_account_selectors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\test_account_console_titles.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_account_console_environment.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_account_identity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_accounts_build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_accounts_build.ps1 -Deploy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAIHANDOFF scoped access and live file relay (hermetic)
        shell: pwsh
        run: |
          # SEND_FILE / TEMPORARY_READ_ACCESS / LIVE_LOG_RELAY: the operator-side
          # companions that let one isolated account see one operator-chosen
          # target without ever widening managed-account isolation. All three are
          # hermetic -- the relay one resolves its account through a stub at
          # SAI_ACCOUNTS_EXE, the access and handoff ones through a
          # test_sai_accounts.Plane whose SAI_ACCOUNTS_ROOT is a temp directory
          # and whose account identifiers are synthetic -- so none of them reads
          # the operator's live registry or prints a real account's identity.
          python tests\test_sai_relay.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\test_sai_access.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\test_sai_handoff.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test managed Antigravity (auto-connect, YOLO, console profile)
        shell: pwsh
        run: |
          # Same hermetic plane as the control-plane suite, plus a stand-in agy.exe
          # that records the command line it was actually started with: the launch
          # contract is proved by the child's argv, never by the engine's own say-so.
          python tests\test_managed_console_context.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_console_profile.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_managed_console_launch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Antigravity console input bridge switch and desktop responsiveness
        shell: pwsh
        run: |
          # P0: the global low-level input hooks are opt-in; a default launch
          # installs none and the guard window reports it. Plus a bounded
          # synthetic-input latency probe. The operator's own degraded-desktop
          # A/B remains a separate, explicitly authorized experiment.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_input_bridge_switch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAITULS Accounts tab contract
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_accounts_tab.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAITULS Accounts runtime flow
        shell: pwsh
        run: |
          # The flow suite, not the tab contract: it drives the real handlers a
          # click reaches -- connect, sign-in, workdir ACL provisioning -- and
          # is where a UI thread that blocks the engine (the "connect button
          # does not answer" report) becomes a failing assertion.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_accounts_runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test destructive worker safety
        shell: pwsh
        run: |
          python tests\test_workers.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\test_destructive_identity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test DEL JUNK ALL DISKS (acceptance gate)
        shell: pwsh
        run: |
          python tests\test_del_junk_all_disks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAISPIN decision engine and watcher self-test
        shell: pwsh
        run: |
          python tests\test_saispin.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 5.1 is where the pipe-encoding and automatic-variable traps live, so
          # the watcher self-test runs on BOTH shells.
          powershell -NoProfile -ExecutionPolicy Bypass -File Scripts\saispin_watch.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File Scripts\saispin_watch.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native queue history acceptance oracle
        shell: pwsh
        run: |
          python tests\test_native_queue_history.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAIPATCH TUI driver FIFO oracle fixtures
        shell: pwsh
        run: |
          python tests\test_progress_oracle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAIPATCH clipboard security and Ctrl+V injector
        shell: pwsh
        run: |
          python tests\test_saipatch_secret_hygiene.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\saipatch_ctrlv_receiver.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\saipatch_ctrlv_e2e.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native TUI boundary probe
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_native_tui_probe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test transactional release payload build
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_build_payload.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test legacy Cline registry ownership
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_legacy_cline.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test agent-menu install transaction
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_agent_menus_transaction.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Codex cascade install preflight
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_codex_menu_preflight.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installer locale generation
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_locale_generation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test %%ROOT%% registry import writes
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_import_safe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Explorer menu launch and argument contract
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_shell_menu.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test single-instance activation publication
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_single_instance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test self-elevating scripts report the elevated child result
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_self_elevation_result.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test project skeleton creation
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_new_proj.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test OpenCode port allocator
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_stable_port.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAIPATCH patch lifecycle
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_saipatch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test scenarios migration registry and launcher
        shell: pwsh
        run: |
          python tests\test_scenarios_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision Secure Apps Python dependencies
        shell: pwsh
        run: |
          # cryptography for the key hierarchy, pywin32 for the privileged-
          # helper transport, and the REAL python-fido2 in the supported
          # range. fido2 used to be omitted on purpose, which meant the
          # authentication provider's only executed line was its ImportError
          # handler -- and that is exactly how it kept compiling against an
          # API generation that no longer existed. The suites still need no
          # security key.
          #
          # PyQt6 is installed for offscreen GUI validation.
          python -m pip install --disable-pip-version-check --quiet cryptography pywin32 psutil "fido2>=2.0,<3" "PyQt6>=6.5,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from importlib import metadata; print('python-fido2', metadata.version('fido2'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps python-fido2 dependency contract (no hardware)
        shell: pwsh
        run: |
          # Constructs the real 2.x client surface against a stub CTAP2
          # device. No authenticator, no elevation, no touch.
          python tests\test_secure_apps_fido2_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps lifecycle (fake auth + fake storage, no hardware)
        shell: pwsh
        run: |
          python tests\test_secure_apps.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps emergency recovery stop-on-refusal (T-254)
        shell: pwsh
        run: |
          # The scripted emergency recovery refuses, stops and tells the truth:
          # a refusal in any step halts the sequence and the key never reaches
          # a command line. Hermetic (mocked PowerShell), no elevation, no disk.
          python tests\test_secure_apps_recovery_ux.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps capacity truth and guarded grow (T-256)
        shell: pwsh
        run: |
          # Measured used/free/virtual capacity (never guessed, unknown is
          # not zero), warning thresholds, plan_grow refusals before any
          # mutation, and the staged grow with post-expansion verification.
          # Hermetic: no real VHDX is grown by these tests.
          python tests\test_secure_apps_capacity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps acceptance (hermetic runner tests, no hardware)
        shell: pwsh
        run: |
          python tests\test_secure_apps_acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps privileged task integration (hermetic)
        shell: pwsh
        run: |
          python tests\test_secure_apps_privtask.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps UI (offscreen PyQt6)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests\test_secure_apps_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps secret hygiene
        shell: pwsh
        run: |
          python tests\test_secure_apps_hygiene.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Secure Apps launcher and storage-helper preflight
        shell: pwsh
        run: |
          # Structural probes only: no elevation, no disk image, no key.
          powershell -NoProfile -ExecutionPolicy Bypass -File Scripts\secure_apps\sa_storage_helper.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File Scripts\secure_apps\SECURE_APPS.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test agent console launcher (non-elevated, data-driven)
        shell: pwsh
        run: |
          # STANDALONE gate. The SAI Accounts control plane is optional, so a
          # runner without it is the case that matters most: it is what a
          # GitHub user who downloaded this one repository actually has. The
          # absence is asserted, so vendoring an engine into the tree later
          # fails loudly instead of quietly turning this into a federated run.
          if (Test-Path 'C:\ProgramData\SAI\Accounts\bin\sai-accounts.exe') {
            Write-Error 'the SAI Accounts control plane is installed on the CI runner'
            exit 1
          }
          python tests\test_consoles_launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Shell Doctor findings and read-only contract
        shell: pwsh
        run: |
          # Fixture findings plus a read-only real-collector smoke (-Json):
          # nothing is reset, no Explorer restart. Both 5.1 and 7.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_shell_doctor.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests\test_shell_doctor.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test USN journal guard safety contract
        shell: pwsh
        run: |
          # The guard that keeps Everything from looping on a 1 MB USN journal.
          # Read-only by default, journal resize non-destructive and polled for
          # delayed visibility, delete+create only under explicit authorization,
          # and an unhealthy journal can never exit 0. Every scenario runs the
          # REAL guard against a recording fake fsutil, a scratch HKCU clamp key
          # and a pinned volume list: no real journal, no real policy, no admin.
          # Each suite run drives the guard under its own runtime and asserts
          # the child psVersion matches: two green runs on the same runtime
          # cannot masquerade as dual-version coverage.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_usn_journal_guard.ps1 -GuardHost powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests\test_usn_journal_guard.ps1 -GuardHost pwsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test USN diagnostic bundle privacy contract
        shell: pwsh
        run: |
          # Scrubber self-test (synthetic fixtures only) plus hermetic
          # integration over adversarial deliverable directories: allowlist
          # membership, hash verification, no raw files, no identifiers.
          powershell -NoProfile -ExecutionPolicy Bypass -File Scripts\host\Export-UsnDiagnosticBundle.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File Scripts\host\Export-UsnDiagnosticBundle.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_usn_diagnostic_bundle.ps1 -RunnerHost powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests\test_usn_diagnostic_bundle.ps1 -RunnerHost pwsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAIPATCH generation and crash recovery
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_saipatch_generation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test INSTALL_ALL transaction recorder
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_installer_transaction.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test INSTALL_ALL real disposable registry rollback
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_installer_registry.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test shared registry mutation lock
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_registry_lock.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test media payload validity and atomic publication
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_media_payload.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test payload backup restoration
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_restore_payload.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAISPIN task transaction and cadence
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_saispin_task.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAI Accounts background keeper (task + toggle + concurrency)
        shell: pwsh
        run: |
          # Installer definition contract plus a live register/verify/disable/
          # remove cycle on a scratch task name (or the categorized
          # ELEVATION_REQUIRED diagnosis where registration is denied). The
          # engine concurrency half lives in test_managed_console_context.py.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_accounts_keeper.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAI Accounts autoconnect desired-state gate, dedup and runtime purity
        shell: pwsh
        run: |
          # Hermetic: the REAL engine against a scratch plane
          # (SAI_ACCOUNTS_ROOT + SAI_ACCOUNTS_SCOPE). Proves the desired-state
          # ordering (lifecycle -> managed-ness -> intent), that two concurrent
          # sweeps dedup to one, that an already-online row starts nothing, and
          # that a runtime sweep never bumps the registry generation.
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_accounts_autoconnect.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAITULS repaint resource churn
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_saituls_repaint.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Folder Automation engine (matching, safety, journal, schedule)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_folder_automation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test TaskbarEdge pure logic
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_taskbar_edge_logic.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test TaskbarEdge architectural contract
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_taskbar_edge_contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAIOPT pure logic
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_saiopt_logic.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test SAIOPT architectural contract
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test_saiopt_contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile shipped C# applications (documented csc commands)
        shell: pwsh
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { Write-Error 'csc.exe not found'; exit 1 }
          New-Item -ItemType Directory -Path $env:TEMP\saibuild -Force | Out-Null
          & $csc -nologo -target:winexe -out:"$env:TEMP\saibuild\SAITULS.exe" -optimize+ `
            -win32icon:SAITULS.ico `
            -r:System.dll -r:System.Drawing.dll -r:System.Windows.Forms.dll -r:System.Web.Extensions.dll `
            SAITULS.cs (Get-ChildItem FolderAutomation\*.cs | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # TaskbarEdge ships as its own background helper, built from the two
          # sources in Scripts\taskbar_edge. It must compile in CI too.
          & $csc -nologo -target:winexe -out:"$env:TEMP\saibuild\TaskbarEdge.exe" -optimize+ `
            -r:System.dll Scripts\taskbar_edge\EdgeLogic.cs Scripts\taskbar_edge\TaskbarEdge.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # SAIOPT, the background optimizer: x64 only (it reads 64-bit
          # kernel process records), same sources as Scripts\saiopt\build.ps1.
          & $csc -nologo -target:winexe -platform:x64 -out:"$env:TEMP\saibuild\SAIOPT.exe" -optimize+ `
            -r:System.dll -r:System.Core.dll -r:System.Drawing.dll -r:System.Windows.Forms.dll -r:System.Management.dll `
            Scripts\saiopt\OptLogic.cs Scripts\saiopt\SAIOPT.cs Scripts\saiopt\SelfTest.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The artifacts are build-verification only; never commit them.
          Write-Host 'SAITULS.exe, TaskbarEdge.exe and SAIOPT.exe compile clean.'
